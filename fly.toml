# Fly.io deployment configuration for DevPlane
app = 'devplane'
primary_region = 'iad'

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = '8000'
  ENV = 'production'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[http_service.checks]]
  interval = '30s'
  timeout = '10s'
  grace_period = '40s'
  method = 'GET'
  path = '/api/health'
  protocol = 'http'
  tls_skip_verify = false

[[vm]]
  size = 'shared-cpu-1x'
  memory = '1gb'

[mounts]
  source = "devplane_data"
  destination = "/app/data"
