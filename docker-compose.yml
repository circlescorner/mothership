# ═══════════════════════════════════════════════════════════════════════════════
# DevPlane Production Docker Compose Configuration
# ═══════════════════════════════════════════════════════════════════════════════

version: "3.8"

services:
  # Main DevPlane Application
  devplane:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    restart: always
    volumes:
      - ./data:/app/data
      - ./static:/app/static
    environment:
      - DEVPLANE_DB_PATH=/app/data/devplane.db
      - ENV=production
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/api/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      - qdrant
    networks:
      - devplane-network

  # Qdrant Vector Database (for semantic memory search)
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./data/qdrant:/qdrant/storage
    restart: always
    environment:
      - QDRANT__SERVICE__API_KEY=${QDRANT_KEY:-}
    networks:
      - devplane-network

  # Cloudflare Tunnel (optional - for secure public access)
  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN}
    restart: always
    depends_on:
      - devplane
    profiles:
      - tunnel
    networks:
      - devplane-network

  # Prometheus (optional - for metrics collection)
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./data/prometheus:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    restart: always
    profiles:
      - monitoring
    networks:
      - devplane-network

  # Grafana (optional - for visualization)
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    volumes:
      - ./data/grafana:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
    restart: always
    profiles:
      - monitoring
    networks:
      - devplane-network

  # Langflow (Visual Chain Builder)
  langflow:
    image: logspace/langflow:latest
    ports:
      - "7860:7860"
    volumes:
      - ./data/langflow:/app/langflow
    restart: always
    networks:
      - devplane-network

  # Flowise (Visual Chain Builder)
  flowise:
    image: flowiseai/flowise:latest
    ports:
      - "3001:3000"
    volumes:
      - ./data/flowise:/root/.flowise
    restart: always
    networks:
      - devplane-network

  # Langfuse (Observability)
  langfuse-server:
    image: langfuse/langfuse:latest
    depends_on:
      - langfuse-db
    ports:
      - "3002:3000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@langfuse-db:5432/postgres
      - NEXTAUTH_SECRET=mysecret
      - SALT=mysalt
      - NEXTAUTH_URL=http://localhost:3002
      - TELEMETRY_ENABLED=false
    restart: always
    networks:
      - devplane-network

  langfuse-db:
    image: postgres:15
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
    volumes:
      - ./data/langfuse-db:/var/lib/postgresql/data
    restart: always
    networks:
      - devplane-network

networks:
  devplane-network:
    driver: bridge
